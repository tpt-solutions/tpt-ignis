name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tpt-ignis
        uses: actions/checkout@v4
        with:
          path: tpt-ignis

      - name: Checkout tpt-keystone-db (sibling)
        uses: actions/checkout@v4
        with:
          repository: tpt-solutions/tpt-keystone-db
          path: tpt-keystone-db

      - name: Checkout tpt-appfront (sibling)
        uses: actions/checkout@v4
        with:
          repository: tpt-solutions/tpt-appfront
          path: tpt-appfront

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tpt-ignis

      - name: fmt
        working-directory: tpt-ignis
        # `--all` sweeps in local path dependencies regardless of workspace
        # membership (a longstanding rustfmt behavior), which would reach into
        # the sibling tpt-keystone-db/tpt-appfront checkouts. List our own
        # packages explicitly instead.
        run: |
          cargo fmt --check \
            -p appfront-core \
            -p appfront-ai-schema \
            -p tpt-plasma-schemas \
            -p tpt-physics-math \
            -p tpt-ui-components \
            -p tpt-fluxstream \
            -p tpt-halo \
            -p tpt-aether \
            -p tpt-oracle \
            -p udf-fft

      - name: clippy
        working-directory: tpt-ignis
        run: cargo clippy --workspace --all-targets

      - name: build
        working-directory: tpt-ignis
        run: cargo build --workspace

      - name: test
        working-directory: tpt-ignis
        run: cargo nextest run --workspace
        continue-on-error: true

      - name: deny
        working-directory: tpt-ignis
        run: cargo deny check
        continue-on-error: true
